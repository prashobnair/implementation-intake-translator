name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11 --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python-version }} --extra dev
      - run: uv run --python ${{ matrix.python-version }} pytest -q --cov=src/intake_translator --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - run: uv run --python ${{ matrix.python-version }} coverage report --include=src/intake_translator/core.py --fail-under=90
      - run: uv run --python ${{ matrix.python-version }} python -m intake_translator.demo
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.11
      - run: uv pip install --python .venv/bin/python .
      - run: .venv/bin/python -c 'import intake_translator.core; print("stdlib core imports")'
      - run: PYTHONPATH=src .venv/bin/python -m unittest tests.test_intake
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11 --extra dev
      - run: uv run pip-audit --skip-editable
      - run: uv run bandit -q -r src
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
