repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        files: ^(src/intake_translator/(core|demo|dashboard)\.py|tests/(test_intake|test_cli|test_more_edges)\.py)$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--strict, src]
        pass_filenames: false
