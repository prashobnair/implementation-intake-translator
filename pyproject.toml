[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implementation-intake-translator"
version = "0.2.1"
description = "Synthetic SaaS implementation intake review packet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ai = []
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.13,<1", "mypy>=1.15,<2", "pre-commit>=4,<6", "pip-audit>=2.9,<3", "bandit>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
