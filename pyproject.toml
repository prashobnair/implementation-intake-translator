[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implementation-intake-translator"
version = "0.4.0"
description = "Synthetic SaaS implementation intake review packet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]
dependencies = [
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "PyYAML>=6,<7",
    "cryptography>=50,<51",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ai = []
e2e = ["playwright>=1.49,<2", "axe-playwright-python>=0.1.4,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.13,<1", "mypy>=1.15,<3", "pre-commit>=4,<6", "pip-audit>=2.9,<3", "bandit>=1.8,<2", "hypothesis>=6,<7", "httpx>=0.27,<1", "import-linter>=2,<3", "types-PyYAML>=6,<7"]

[tool.setuptools.package-data]
"intake_translator.review_layer" = ["ui/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.importlinter]
root_package = "intake_translator"

[[tool.importlinter.contracts]]
name = "Pure core cannot import service or storage layers"
type = "forbidden"
source_modules = ["intake_translator.core"]
forbidden_modules = ["intake_translator.ingress", "intake_translator.storage", "intake_translator.review_layer", "intake_translator.outbox", "intake_translator.projectors", "intake_translator.ai", "intake_translator.web", "intake_translator.connectors", "intake_translator.store", "intake_translator.review", "intake_translator.mock_crm", "intake_translator.http_api", "intake_translator.http_api_legacy", "intake_translator.dashboard", "intake_translator.demo", "intake_translator.cli"]
